# Link checker for Markdown docs in this repo.
exclude_path = [
  ".git",
  "node_modules",
  "docs/sdk",
  "docs/api-site",
  "build",
]

# Local dev URLs are expected in examples; skip network checks for them.
# Language SDK subpaths are excluded until the first main publish that builds
# docs/sdk/{typescript,java,python}/ (site root index already exists).
exclude = [
  '^http://localhost',
  '^https://localhost',
  '^https://sophias-hub\.github\.io/docs-sdk/(typescript|java|python)/?',
  # Present locally; remote 404 until CHANGELOG merges to main.
  '^https://github.com/sophias-hub/notification-hub-service/blob/.*/CHANGELOG',
]
