# Prose lint for human-authored Markdown in this repo.
# Styles are downloaded in CI via `vale sync` (see .github/workflows/ci.yml).
StylesPath = .vale/styles
Packages = Microsoft
MinAlertLevel = error

[*.md]
BasedOnStyles = Microsoft

# Technical docs commonly use API/SDK acronyms in headings, URLs in deployment guides,
# and "agent" in the sense of coding assistants—not Microsoft PDA terminology.
Microsoft.HeadingAcronyms = NO
Microsoft.GeneralURL = NO
Microsoft.Terms = NO
Microsoft.FirstPerson = NO
