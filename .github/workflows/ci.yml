name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Prepare local bin
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Cache Vale styles
        uses: actions/cache@v4
        with:
          path: .vale/styles
          key: vale-styles-${{ hashFiles('.vale.ini') }}

      - name: Cache Vale
        id: vale-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/vale
          key: vale-3.15.1-${{ runner.os }}

      - name: Install Vale
        if: steps.vale-cache.outputs.cache-hit != 'true'
        run: |
          VALE_VERSION=3.15.1
          curl -sfL -o vale.tar.gz \
            "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          tar -xzf vale.tar.gz vale
          mv vale "$HOME/.local/bin/vale"
          chmod +x "$HOME/.local/bin/vale"
          rm vale.tar.gz

      - name: Verify Vale
        run: |
          test -x "$HOME/.local/bin/vale"
          vale --version

      - name: Cache Lychee
        id: lychee-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/lychee
          key: lychee-0.18.1-${{ runner.os }}

      - name: Install Lychee
        if: steps.lychee-cache.outputs.cache-hit != 'true'
        run: |
          LYCHEE_VERSION=0.18.1
          curl -sfL -o lychee.tar.gz \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf lychee.tar.gz
          mv lychee "$HOME/.local/bin/lychee"
          rm lychee.tar.gz
      - name: Verify Lychee
        run: lychee --version

      - name: Run validation
        run: npm run validate

  test-and-build-docs:
    name: Test and build docs
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npx tsoa spec && npx swagger-cli validate docs/api/swagger.json
      - run: npm run docs:sdk
      - name: Build API docs site
        env:
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
        run: |
          if [ -z "${PUBLIC_API_URL}" ]; then
            echo "::warning::PUBLIC_API_URL is not set. Swagger Try it out will target localhost."
            echo "Add a repo Variable PUBLIC_API_URL (e.g. https://notification-hub-service.onrender.com) for interactive docs."
          else
            echo "Swagger Try it out target: ${PUBLIC_API_URL}"
          fi
          npm run docs:api:site
      - run: npm run docs:finalize

      - name: Upload SDK docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-docs
          path: docs/sdk

      - name: Upload API docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: docs/api-site

      - name: Upload docs metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-meta
          path: docs/meta.json

  publish-sdk-docs:
    name: Publish SDK docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, test-and-build-docs]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download SDK docs artifact
        uses: actions/download-artifact@v4
        with:
          name: sdk-docs
          path: docs/sdk

      - name: Publish to sophias-hub/docs-sdk
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DOCS_SDK_DEPLOY_KEY }}
          external_repository: sophias-hub/docs-sdk
          publish_branch: main
          publish_dir: docs/sdk
          destination_dir: .
          keep_files: false

  publish-api-docs:
    name: Publish API docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, test-and-build-docs]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download API docs artifact
        uses: actions/download-artifact@v4
        with:
          name: api-docs
          path: docs/api-site

      - name: Publish to sophias-hub/docs-api
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DOCS_API_DEPLOY_KEY }}
          external_repository: sophias-hub/docs-api
          publish_branch: main
          publish_dir: docs/api-site
          destination_dir: .
          keep_files: false