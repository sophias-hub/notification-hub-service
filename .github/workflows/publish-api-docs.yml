name: Publish API docs to docs-api repo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run docs:api:site

      - name: Publish Swagger UI site to sophias-hub/docs-api
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DOCS_API_DEPLOY_KEY }}
          external_repository: sophias-hub/docs-api
          publish_branch: main
          publish_dir: docs/api-site
          destination_dir: .
          keep_files: false
