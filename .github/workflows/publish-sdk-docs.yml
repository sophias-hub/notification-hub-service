name: Publish SDK docs to docs-sdk repo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run docs:sdk

      - name: Publish TypeDoc site to sophias-hub/docs-sdk
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DOCS_SDK_DEPLOY_KEY }}
          external_repository: sophias-hub/docs-sdk
          publish_branch: main
          publish_dir: docs/sdk
          destination_dir: .
          keep_files: false